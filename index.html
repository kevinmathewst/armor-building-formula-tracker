<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armor Building Formula</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f7fb;color:#172033;margin:0;padding:20px}.timer{max-width:650px;margin:auto}.cards{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.box{padding:16px;border-radius:20px;color:white}.w{background:#172033}.l{background:#ea580c}.r{background:#059669}.clock{font-size:32px;font-weight:900;margin:8px 0}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;background:#ffffff30;color:white}.start{background:#16a34a}.restbtn{background:#f59e0b}.stop{background:#dc2626}.reset{background:#ffffff25}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.w{grid-column:1/-1}}</style></head><body><main class="timer"><div class="cards"><section class="box w"><small>WORKOUT</small><div id="work" class="clock">00:00</div><button id="main" class="btn start">START</button> <button id="stop" class="btn" disabled>STOP</button> <button id="reset" class="btn reset">RESET</button></section><section class="box l"><small>15-MINUTE</small><div id="limit" class="clock">15:00</div><button id="limitReset" class="btn reset">RESET</button></section><section class="box r"><small>REST</small><div id="rest" class="clock">01:00</div><button id="restReset" class="btn reset">RESET</button></section></div></main><script>(()=>{const K='abf_timer_state_v6';let s=JSON.parse(localStorage.getItem(K)||'null')||{acc:0,started:null,limit:900,limitEnd:null,rest:60,restEnd:null};const save=()=>localStorage.setItem(K,JSON.stringify(s)),now=()=>Date.now(),elapsed=()=>s.acc+(s.started?Math.max(0,(now()-s.started)/1000):0),remaining=(end,val)=>end?Math.max(0,(end-now())/1000):val;function fmt(x){x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function active(){return!!s.started}function resting(){return!!s.restEnd}function start(){if(!s.started)s.started=now();if(s.limit<=0)s.limit=900;if(!s.limitEnd)s.limitEnd=now()+s.limit*1000;save()}function beginRest(){if(!active())return;let r=remaining(s.restEnd,s.rest);s.rest=r>0?r:60;s.restEnd=now()+s.rest*1000;save()}function stop(){if(!confirm('Stop and end this workout?'))return;s.acc=elapsed();s.started=null;s.limitEnd=null;s.restEnd=null;s.limit=900;s.rest=60;save()}function reset(){if(!confirm('Reset the active workout timers?'))return;s={acc:0,started:null,limit:900,limitEnd:null,rest:60,restEnd:null};save()}main.onclick=()=>{if(!active())start();else if(resting()){s.restEnd=null;s.rest=60;save()}else beginRest();draw()};stop.onclick=()=>{stop();draw()};reset.onclick=()=>{reset();draw()};limitReset.onclick=()=>{s.limit=900;s.limitEnd=null;save();draw()};restReset.onclick=()=>{s.rest=60;s.restEnd=null;save();draw()};function draw(){let l=remaining(s.limitEnd,s.limit),r=remaining(s.restEnd,s.rest);if(s.limitEnd&&l<=0){s.limit=0;s.limitEnd=null;l=0;save()}if(s.restEnd&&r<=0){s.rest=0;s.restEnd=null;r=0;save()}work.textContent=fmt(elapsed());limit.textContent=fmt(l);rest.textContent=fmt(r);main.textContent=!active()?'START':resting()?'RESTING':'REST';main.className='btn '+(!active()?'start':'restbtn');stop.textContent='STOP';stop.className='btn '+(active()?'stop':'');stop.disabled=!active()}draw();setInterval(draw,200)})();</script></body></html>
