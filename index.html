;grid-template-columns:42px 1fr 42px;height:42px}.stepper button{border:1px solid #d9dde5;background:#f5f6f8;font-size:25px;color:var(--ink)}.stepper strong{display:grid;place-items:center;border-top:1px solid #d9dde5;border-bottom:1px solid #d9dde5;background:#fff;font-size:19px}.field select,.field input{width:100%;border:1px solid #d9dde5;background:#fff;border-radius:12px;padding:10px;color:var(--ink)}.logGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.logGrid .wide{grid-column:1/-1}.summaryRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.summaryRow:last-child{border-bottom:0}.tabs{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));background:#fff;border:1px solid #e1e3e9;border-radius:21px;padding:5px;display:grid;grid-template-columns:1fr 1.35fr 1fr;box-shadow:0 15px 45px #18233d20;backdrop-filter:blur(16px)}.tabs button{border:0;background:transparent;padding:12px 4px;border-radius:15px;color:#737b8c;font-weight:850;font-size:12px}.tabs button[data-tab="today"]{font-size:15px;padding:14px 4px;font-weight:950}.tabs button.on{background:#1d2d5b;color:#fff}.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:18px;background:#fbfbfc}.stat b{display:block;font-size:26px;margin-top:4px}.historyItem{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.historyItem:last-child{border-bottom:0}.dateBox{font-size:10px;font-weight:900;color:#6b7485}.historyItem b{display:block}.historyItem small{color:#7b8493}.empty{text-align:center;padding:32px 10px;color:var(--muted)}.programWeek{border:1px solid var(--line);border-radius:17px;margin:8px 0;overflow:hidden}.programWeek summary{padding:14px 16px;font-weight:900;cursor:pointer}.programWeek[open] summary{border-bottom:1px solid var(-- <body>
<div class="app">
<section class="timerGrid">
<div class="timer limit"><div class="timerLabel">15-MIN</div><div id="limitClock" class="time">15:00</div><div class="controls"><button id="limitReset" class="btn ghost">RESET</button></div></div>

</section>
<button id="mainBtn" class="primaryAction start">START</button>
<div id="todayView"></div><div id="progressView" class="hidden"></div><div id="programView" class="hidden"></div>
</div><nav class="tabs"><button data-tab="progress">Progress</button><button data-tab="today" class="on">Workout</button><button data-tab="program">Program</button></nav><div id="toast" class="toast"></div>
<script>
(()=>{let wakeLock=null;async function keepScreenOn(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}function releaseScreen(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timers?.running)keepScreenOn()});const KEY='abf_rebuild_v1',TKEY='abf_timer_rebuild_v2',BACKUP_KEY='abf_backup_v1',BACKUP_EXPORT_KEY='abf_last_auto_export_v1',SCHEMA=1;const defaultData={startDate:new Date().toISOString().slice(0,10),logs:[],prefs:{left:20,right:20,variant:'Double'}};let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;let timers=JSON.parse(localStorage.getItem(TKEY)||'null')||{elapsed:0,lastTick:null,running:false,limit:900,limitEnd:null,rest:60,restEnd:null};const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),saveT=()=>localStorage.setItem(TKEY,JSON.stringify(timers)),now=()=>Date.now(),workElapsed=()=>timers.elapsed+(timers.running&&timers.lastTick?Math.max(0,(now()-timers.lastTick)/1000):0),remaining=(end,fallback)=>end?Math.max(0,(end-now())/1000):fallback,fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}function startWorkout(){if(!timers.running){timers.running=true;timers.lastTick=now();keepScreenOn();if(!timers.limitEnd&&timers.limit>0)timers.limitEnd=now()+timers.limit*1000;saveT();drawTimers()}}function startRest(){if(!timers.running)return;timers.restEnd=now()+60000;saveT();drawTimers()}function mainAction(){if(!timers.running){startWorkout();return}if(!timers.restEnd)startRest()}function stopWorkout(){if(!timers.running)return;if(!confirm('Stop and end this workout?'))return;releaseScreen();timers={elapsed:0,lastTick:null,running:false,limit:900,limitEnd:null,rest:60,restEnd:null};saveT();drawTimers();toast('Workout ended')}function drawTimers(){if(timers.running&&timers.lastTick){timers.elapsed=workElapsed();timers.lastTick=now()}let l=remaining(timers.limitEnd,timers.limit),r=remaining(timers.restEnd,timers.rest);if(timers.limitEnd&&l<=0){timers.limit=0;timers.limitEnd=null;l=0;saveT()}if(timers.restEnd&&r<=0){timers.rest=60;timers.restEnd=null;r=60;saveT()}document.getElementById('workClock').textContent=fmt(workElapsed());document.getElementById('limitClock').textContent=fmt(l);document.getElementById('restClock').textContent=fmt(r);const active=timers.running,resting=!!timers.restEnd,m=document.getElementById('mainBtn');m.textContent=!active?'START':resting?'RESTING':'START REST';m.className='primaryAction '+(!active?'start':resting?'resting':'rest');document.getElementById('stopBtn').disabled=!active;document.getElementById('stopBtn').className='btn '+(active?'stop':'ghost')}const schedule={1:[['Press + ABC','Press first; then ABC','At least 20–30 press reps; at least 5 ABC rounds'],['ABC + Press','ABC first; then Press','At least 5 ABC rounds; at least 20–30 press reps'],['Press + ABC','Press first; then ABC','At least 20–30 press reps; at least 5 ABC rounds']],2:[['ABC + Press','ABC first; then Press','At least 5 ABC rounds; at least 20–30 press reps'],['Press + ABC','Press first; then Press','At least 20–30 press reps; at least 5 ABC rounds'],['ABC + Press','ABC first; then Press','At least 5 ABC rounds; at least 20–30 press reps']],3:[['Press','Press','Build from prior work'],['ABC','ABC','15–20 rounds'],['Press','Press','Day Two is the hardest session of the week']],4:[['ABC','ABC','Medium/light; tally slightly above the prior hard week'],['Press','Press','Hardest session of the week'],['ABC','ABC','Medium/light']],5:[['Press','Press','Build from prior work'],['ABC','ABC','20–25 rounds'],['Press','Press','Reduce volume after the hard session as prescribed']],6:[['ABC','ABC','Medium/light; tally slightly above the prior hard week'],['Press','Press','Hardest session of the week'],['ABC','ABC','Medium/light']],7:[['Press','Press','3 × 2-3-5-10 OR, if heavier, 5 × 2-3-5'],['ABC','ABC','GOAL: 30 rounds'],['Press','Press','2 × 2-3-5-10 OR 3–4 × 2-3-5']],8:[['ABC','ABC','About 15 rounds'],['Press','Press','GOAL: 100 reps — 5 × 2-3-5-10 OR 10 × 2-3-5'],['ABC','ABC','About 20 rounds']]};function dayIndex(){const start=new Date(data.startDate+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);return Math.min(55,Math.max(0,Math.floor((today-start)/86400000)))}function currentWD(){const n=dayIndex();return{week:Math.floor(n/7)+1,day:n%7+1}}function planFor(w,d){return schedule[w]?.[d-1]||schedule[8][2]}function totalReps(type,r,e){return(type==='ABC'?r*6:r*20)+(e||0)}function effectiveWeight(x){return Math.max(Number(x.left)||0,Number(x.right)||0)}function movementForm(title,type,week,day,existing){const x=existing||{},variant=x.variant||data.prefs.variant,left=x.left||data.prefs.left,right=x.right||data.prefs.right,rounds=x.rounds??0,extra=x.extra||0,rpe=x.rpe||'';return `<section class="section movement" data-form="${type}"><div class="movementTitle"><h4>${title}</h4><span class="pill" style="background:#eef0f6;color:#536074">${type==='ABC'?'2 cleans · 1 press · 3 squats':'2-3-5-10 ladder'}</span></div><div class="note" style="margin-top:10px"><b>Today:</b> ${type==='ABC'?(week===7?'30 rounds goal':week===5?'20–25 rounds':week===3?'15–20 rounds':'Follow the week’s prescribed volume'):'Use the prescribed ladder volume for this week'}<br><span class="muted">${type==='ABC'?'6 reps per bilateral/offset round':'20 reps per full 2-3-5-10 ladder'}</span></div><div class="field" style="margin-top:13px"><label>EXECUTION</label></div><div class="seg"><button data-v="Double" class="${variant==='Double'?'on':''}">Double</button><button data-v="Single" class="${variant==='Single'?'on':''}">Single</button><button data-v="Offset" class="${variant==='Offset'?'on':''}">Offset</button></div><div class="field"><label>KETTLEBELLS</label></div><div class="bells"><button data-w="20" class="${left==20?'on':''}">20 lb</button><button data-w="30" class="${left==30?'on':''}">30 lb</button><button data-w="40" class="${left==40?'on':''}">40 lb</button></div><div class="bellRow"><div class="field"><label>LEFT BELL</label><select data-field="left"><option ${left==20?'selected':''}>20</option><option ${left==30?'selected':''}>30</option><option ${left==40?'selected':''}>40</option></select></div><div class="field"><label>RIGHT BELL</label><select data-field="right"><option ${right==20?'selected':''}>20</option><option ${right==30?'selected':''}>30</option><option ${right==40?'selected':''}>40</option></select></div></div><div class="logGrid" style="margin-top:10px"><div class="field"><label>ROUNDS</label><div class="stepper"><button type="button" data-step="rounds" data-delta="-1">−</button><strong data-field="rounds">${rounds}</strong><button type="button" data-step="rounds" data-delta="1">+</button></div></div><div class="field"><label>EXTRA REPS</label><div class="stepper"><button type="button" data-step="extra" data-delta="-1">−</button><strong data-field="extra">${extra}</strong><button type="button" data-step="extra" data-delta="1">+</button></div></div><div class="field"><label>RPE</label><select data-field="rpe"><option value="">—</option>${Array.from({length:10},(_,i)=>`<option ${i+1==rpe?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="field"><label>TIME</label><input data-field="time" placeholder="e.g. 12:40" value="${x.time||''}"></div><div class="field wide"><label>NOTES</label><input data-field="notes" placeholder="Optional" value="${x.notes||''}"></div></div><div class="summaryRow"><span class="muted">Total reps</span><strong data-total>${totalReps(type,rounds,Number(extra))}</strong></div><button class="btn" style="width:100%;background:#1d2d5b;color:#fff" data-save="${type}">${x.saved?'Update':'Log '+title}</button></section>`}function renderToday(){const{week,day}=currentWD(),p=planFor(week,day),existing=data.logs.find(x=>x.dayKey===week+'-'+day),both=p[0].includes('+');document.getElementById('todayView').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px"><span class="week">WEEK ${week} · DAY ${day}</span><span class="pill" style="background:${week>=7?'#fff0d8':'#eef0f6'};color:#536074">${week>=7?'GOAL WEEK':"TODAY"}</span></div>${both?movementForm('Press','Press',week,day,existing?.press):movementForm(p[1],p[1]==='Press'?'Press':'ABC',week,day,existing)}${both?movementForm('ABC','ABC',week,day,existing?.abc):''}`}function collectForm(form,type){const g=f=>form.querySelector(`[data-field="${f}"]`);return{type,variant:form.querySelector('.seg .on')?.dataset.v||'Double',left:Number(g('left').value),right:Number(g('right').value),rounds:Number(g('rounds').textContent),extra:Number(g('extra').textContent)||0,rpe:g('rpe').value?Number(g('rpe').value):null,time:g('time').value.trim(),notes:g('notes').value.trim(),total:totalReps(type,Number(g('rounds').value),Number(g('extra').value)||0)}}function saveMovement(type,form){const{week,day}=currentWD(),item=collectForm(form,type);item.week=week;item.day=day;item.dayKey=week+'-'+day;item.date=new Date().toISOString().slice(0,10);item.saved=true;data.prefs.left=item.left;data.prefs.right=item.right;data.prefs.variant=item.variant;let d=data.logs.find(x=>x.dayKey===item.dayKey);if(!d){d={dayKey:item.dayKey,date:item.date,week,day};data.logs.push(d)}d[type.toLowerCase()]=item;save();renderAll();toast(type+' logged')}function exportBackup(){const payload={app:"ABF Tracker",schema:SCHEMA,exportedAt:new Date().toISOString(),data:data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="abf-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup exported")}function importBackup(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.app!=="ABF Tracker"||!p.data||!Array.isArray(p.data.logs))throw Error("Invalid backup");if(!confirm("Replace the current workout data with this backup?"))return;localStorage.setItem(BACKUP_KEY,JSON.stringify({schema:SCHEMA,savedAt:new Date().toISOString(),data:data}));data=p.data;save();renderAll();toast("Backup restored")}catch(e){alert("That file is not a valid ABF Tracker backup.")}};r.readAsText(file)}function renderProgress(){const items=[];data.logs.forEach(d=>['press','abc'].forEach(k=>{if(d[k])items.push(d[k])}));items.sort((a,b)=>String(b.date).localeCompare(String(a.date)));const abc=data.logs.flatMap(x=>x.abc?[x.abc]:[]),press=data.logs.flatMap(x=>x.press?[x.press]:[]),sessions=abc.length+press.length,bestABC=Math.max(0,...abc.map(x=>x.rounds)),bestPress=Math.max(0,...press.map(x=>x.total)),maxW=Math.max(0,...data.logs.flatMap(x=>[x.abc,x.press].filter(Boolean).map(effectiveWeight)));document.getElementById('progressView').innerHTML=`<section class="section"><h3>Progress</h3><div class="statGrid"><div class="stat"><span class="muted">Sessions logged</span><b>${sessions}</b><small>of 24 planned</small></div><div class="stat"><span class="muted">Consistency</span><b>${Math.round(sessions/24*100)}%</b></div><div class="stat"><span class="muted">Best ABC</span><b>${bestABC} rounds</b></div><div class="stat"><span class="muted">Best Press</span><b>${bestPress} reps</b></div></div></section><section class="section"><h3>Personal records</h3><div class="summaryRow"><span>Best ABC rounds</span><strong>${bestABC}</strong></div><div class="summaryRow"><span>Best Press reps</span><strong>${bestPress}</strong></div><div class="summaryRow"><span>Heaviest bell</span><strong>${maxW?maxW+' lb':'—'}</strong></div></section><section class="section"><h3>Data backup</h3><p class="muted">Your workouts are saved on this device automatically. Export a backup periodically so your history can be restored if browser data is cleared.</p><div class="buttonRow"><button class="btn" id="exportBackup">EXPORT BACKUP</button><button class="btn ghost" id="importBackup">IMPORT BACKUP</button><input id="backupFile" type="file" accept=".json,application/json" hidden></div></section><section class="section"><h3>Workout history</h3>${items.length?items.map(x=>`<div class="historyItem"><div class="dateBox">${x.date.slice(5).replace("-","/")}<br>W${x.week} D${x.day}</div><div><b>${x.type}</b><small>${x.variant} · ${effectiveWeight(x)} lb · ${x.rounds} rounds · ${x.total} reps${x.rpe?" · RPE "+x.rpe:""}</small></div><button class="btn small" data-delete="${x.dayKey}|${x.type.toLowerCase()}">×</button></div>`).join(""):"<div class=\"empty\">No workouts logged yet.<br>Your first session will appear here.</div>"}</section>`}function renderProgram(){document.getElementById('programView').innerHTML=`<section class="section"><div class="eyebrow">REFERENCE</div><h3>The Armor Building Formula</h3><p class="muted">Based on Dan John’s <i>The Armor Building Formula</i>. Use the book as the reference for program details, exercise technique, and progression.</p><div class="note"><b>Core patterns</b><br>ABC: 2 cleans → 1 press → 3 front squats.<br>Press: 2-3-5-10 ladder structure.</div></section><section class="section"><h3>The 8-week plan</h3><p class="muted">The original structure is preserved. Weeks 1–2 contain both Press and ABC in the prescribed order. Weeks 3–6 alternate movements with Day Two as the hardest session. Weeks 7–8 are the goal weeks.</p><div class="field" style="margin:14px 0"><label>PROGRAM START DATE</label><input id="startDate" type="date" value="${data.startDate}"></div>${Object.entries(schedule).map(([w,days])=>`<details class="programWeek" ${w<=2?'open':''}><summary>Week ${w}${w>=7?' · GOAL WEEK':''}</summary><div class="days">${days.map((d,i)=>`<div class="day"><b>Day ${i+1} — ${d[0]}</b><div class="goal">${d[2]}</div></div>`).join('')}</div></details>`).join('')}</section><section class="section"><h3>Movement rules</h3><div class="summaryRow"><span>ABC</span><strong>2 cleans → 1 press → 3 front squats</strong></div><div class="summaryRow"><span>Press ladder</span><strong>2-3-5-10 = 20 reps</strong></div><div class="summaryRow"><span>Equipment options</span><strong>Double · Single · Offset</strong></div></section>`}function renderInfo(){}function renderAll(){renderToday();renderProgress();renderProgram();document.getElementById('startDate').onchange=e=>{data.startDate=e.target.value;save();renderAll();toast('Program date updated')}}function tab(n){['today','progress','program'].forEach(x=>{document.getElementById(x+'View').classList.toggle('hidden',x!==n);document.querySelector(`[data-tab="${x}"]`).classList.toggle('on',x===n)})}document.addEventListener('click',e=>{const t=e.target;if(t.matches('.tabs button'))return tab(t.dataset.tab);if(t.id==='exportBackup')return exportBackup();if(t.id==='importBackup')return document.getElementById('backupFile').click();if(t.id==='mainBtn')return mainAction();if(t.dataset.step){const form=t.closest('.movement'),field=form.querySelector('[data-field="'+t.dataset.step+'"]'),delta=Number(t.dataset.delta),max=t.dataset.step==='rounds'?35:100;field.textContent=Math.max(0,Math.min(max,Number(field.textContent)+delta));form.querySelector('[data-total]').textContent=totalReps(form.dataset.form,Number(form.querySelector('[data-field="rounds"]').textContent),Number(form.querySelector('[data-field="extra"]').textContent));return}if(t.id==='stopBtn')return stopWorkout();if(t.id==='limitReset'){timers.limit=900;timers.limitEnd=timers.running?now()+900000:null;saveT();return drawTimers()}if(t.id==='restReset'){timers.rest=60;timers.restEnd=null;saveT();return drawTimers()}if(t.dataset.v){t.closest('.seg').querySelectorAll('button').forEach(b=>b.classList.remove('on'));t.classList.add('on')}if(t.dataset.w){const f=t.closest('.movement');f.querySelector('[data-field="left"]').value=t.dataset.w;f.querySelector('[data-field="right"]').value=t.dataset.w}if(t.dataset.save)return saveMovement(t.dataset.save,t.closest('.movement'));if(t.dataset.delete){const[k,type]=t.dataset.delete.split('|');if(confirm('Delete this logged movement?')){const d=data.logs.find(x=>x.dayKey===k);if(d)delete d[type];data.logs=data.logs.filter(x=>x.press||x.abc);save();renderAll()}}});document.addEventListener('change',e=>{if(e.target.id==='backupFile'&&e.target.files[0])return importBackup(e.target.files[0]);if(e.target.matches('[data-field="rounds"],[data-field="extra"]')){const f=e.target.closest('.movement');f.querySelector('[data-total]').textContent=totalReps(f.dataset.form,Number(f.querySelector('[data-field="rounds"]').value),Number(f.querySelector('[data-field="extra"]').value)||0)}});renderAll();drawTimers();setInterval(drawTimers,250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
