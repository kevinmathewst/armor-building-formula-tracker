<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20242b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>Armor Building Formula</title>
<style>
:root{--ink:#20242b;--muted:#64748b;--paper:#f4f5f7;--card:#fff;--line:#e1e4e9;--blue:#3b82f6;--shadow:0 8px 28px #20242b14}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:920px;margin:auto;padding:12px 16px 105px}
.timerGrid{position:sticky;top:0;z-index:30;display:flex;flex-direction:column;align-items:center;margin:0 -11px 10px;padding-top:env(safe-area-inset-top);text-align:center;background:var(--paper)}.timer{border-radius:20px;padding:11px 14px;color:#fff;box-shadow:var(--shadow)}.limit{width:100%;min-height:126px;background:linear-gradient(135deg,#3b82f6,#60a5fa)}.secondaryTimers{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:7px}.secondaryTimer{display:flex;align-items:baseline;gap:5px;color:var(--muted)}.secondaryTimer .timerLabel{font-size:8px;color:var(--muted)}.secondaryTimer .time{font-size:18px;color:var(--ink);font-weight:900;margin:0;letter-spacing:-.04em}.secondaryTimer .controls{display:inline-flex;margin-left:2px}.secondaryTimer .btn{font-size:8px;padding:3px 5px;border-radius:7px}.timerLabel{font-size:10px;font-weight:900;letter-spacing:.1em;opacity:.78}.time{font-variant-numeric:tabular-nums;font-size:clamp(34px,8vw,58px);font-weight:950;letter-spacing:-.05em;line-height:1;margin:9px 0 8px}.controls{display:flex;justify-content:center;gap:5px}.btn{border:0;border-radius:10px;padding:7px 10px;font-weight:850;color:var(--ink);background:#fff}.ghost{background:#ffffff1c;color:#fff;border:1px solid #ffffff35}.stop{background:#d84a4a;color:#fff}.primaryAction{width:100%;border:0;border-radius:16px;padding:14px;font-size:18px;font-weight:950;margin-bottom:10px;box-shadow:var(--shadow)}.primaryAction.start{background:#3b82f6;color:#fff}.primaryAction.rest{background:#3b82f6;color:#fff}.primaryAction.resting{background:#2f9e68;color:#fff}
.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 4px 18px #20242b09}.section h2{margin:0 0 12px;letter-spacing:-.03em;font-size:24px}.week{font-size:10px;font-weight:900;letter-spacing:.16em;color:#64748b}.todayHead{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 9px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:900;letter-spacing:.06em;background:#eef0f5;color:#64748b}.goal{background:#fff0d7;color:#87530f}.note{background:#f2f3f7;border-radius:13px;padding:10px 12px;color:#64748b;font-size:13px}.movement{touch-action:manipulation;border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.movement:first-child{border-top:0;padding-top:0;margin-top:0}.bellRow,.logGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.logPrimary{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}.topLogPrimary{margin-top:0;margin-bottom:10px}.bigMetric{border:1px solid #d8dce4;border-radius:16px;background:#f8f9fb;padding:10px}.bigMetric label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}.metricInput{display:grid;grid-template-columns:1fr 1fr 1fr;height:84px}.metricInput button{border:1px solid #d8dce4;background:#eef1f5;font-size:28px;font-weight:700}.metricInput input{width:100%;min-width:0;border:1px solid #d8dce4;border-left:0;border-right:0;border-radius:0;background:#fff;text-align:center;font-size:48px;font-weight:950;color:var(--ink);font-variant-numeric:tabular-nums}.metricHint{font-size:9px;color:var(--muted);text-align:center;margin-top:5px}.field label{display:block;font-size:9px;font-weight:900;letter-spacing:.08em;color:#64748b;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #d8dce4;border-radius:10px;padding:9px;background:#fff;color:var(--ink);touch-action:manipulation}.stepper{height:42px;display:grid;grid-template-columns:42px 1fr 42px}.stepper button{border:1px solid #d8dce4;background:#f5f6f8;font-size:24px;color:var(--ink)}.stepper strong{display:grid;place-items:center;border-top:1px solid #d8dce4;border-bottom:1px solid #d8dce4;font-size:18px}.wide{grid-column:1/-1}.summary{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;color:var(--muted)}.saveBtn{width:100%;margin-top:10px;background:var(--blue);color:#fff}
.tabs{position:fixed;z-index:40;bottom:10px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));display:grid;grid-template-columns:1fr 1.35fr 1fr;background:#fff;border:1px solid #e0e3e9;border-radius:20px;padding:5px;box-shadow:0 15px 45px #20242b25;backdrop-filter:blur(16px)}.tabs button{border:0;background:transparent;padding:11px 4px;border-radius:15px;color:#64748b;font-weight:850;font-size:12px}.tabs button:nth-child(2){font-size:15px;padding:13px 4px}.tabs button.on{background:var(--blue);color:#fff}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fbfbfc}.stat span{font-size:10px;color:var(--muted);font-weight:800}.stat b{display:block;font-size:24px;margin-top:3px}.historyItem{display:grid;grid-template-columns:65px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.historyItem:last-child{border:0}.dateBox{font-size:10px;font-weight:900;color:var(--muted)}.historyItem b{display:block}.historyItem small{color:var(--muted)}.danger{background:#fff0f0;color:#b33b3b}.empty{padding:28px 8px;text-align:center;color:var(--muted)}.programWeek{border:1px solid var(--line);border-radius:14px;margin:7px 0;overflow:hidden}.programWeek summary{padding:12px 14px;font-weight:900;cursor:pointer}.days{padding:2px 14px 10px}.day{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.toast{position:fixed;z-index:60;left:50%;bottom:85px;transform:translate(-50%,15px);background:#20242b;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:650px){.app{padding-left:11px;padding-right:11px}.logPrimary{gap:8px}.bigMetric{padding:9px}.metricInput{grid-template-columns:1fr 1fr 1fr;height:90px}.metricInput input{font-size:52px}.limit{min-height:116px;padding:9px 10px}.limit .time{width:100%;font-size:clamp(72px,35vw,150px);margin:8px 0 10px}.secondaryTimers{gap:14px}.secondaryTimer .time{font-size:17px}.secondaryTimer .btn{font-size:7px;padding:3px 4px}.primaryAction{top:auto}}
@media(max-width:300px){.app{padding:3px 4px 8px}.timerGrid{margin:0 -4px 4px}.limit{width:100%;min-height:78px;border-radius:10px;padding:5px 4px}.limit .timerLabel{font-size:6px}.limit .time{font-size:24px;margin:4px 0}.limit .btn{font-size:7px;padding:3px;border-radius:7px}.secondaryTimers{gap:8px;margin-top:4px}.secondaryTimer{gap:3px}.secondaryTimer .timerLabel{font-size:6px}.secondaryTimer .time{font-size:13px}.secondaryTimer .btn{font-size:6px;padding:2px 3px}.primaryAction{top:auto;border-radius:9px;padding:7px;font-size:11px;margin-bottom:5px}.section{border-radius:11px;padding:8px;margin:4px 0}.section h2{font-size:15px}.movement{padding-top:7px;margin-top:7px}.pill{font-size:6px;padding:3px 5px}.note{font-size:8px;padding:6px}.bellRow,.logGrid{gap:4px}.logPrimary{gap:4px}.bigMetric{padding:5px;border-radius:9px}.metricInput{grid-template-columns:25px 1fr 25px;height:48px}.metricInput input{font-size:25px}.metricInput button{font-size:18px}.metricHint{font-size:6px}.field label{font-size:6px}.field input,.field select{padding:5px;font-size:8px}.stepper{height:28px;grid-template-columns:27px 1fr 27px}.stepper button{font-size:17px}.stepper strong{font-size:12px}.tabs{display:none}.saveBtn{font-size:9px;padding:6px}.historyItem{grid-template-columns:46px 1fr auto;font-size:9px}.historyItem small{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<div class="timerGrid">
<div class="timer limit"><div class="timerLabel">15-MINUTE LIMIT</div><div id="limitClock" class="time">15:00</div><div class="controls"><button type="button" id="limitReset" class="btn ghost">RESTART</button></div></div>
<div class="secondaryTimers">
  <div class="secondaryTimer"><span class="timerLabel">TOTAL</span><span id="workClock" class="time">00:00</span><div class="controls"><button type="button" id="stopBtn" class="btn ghost" disabled>STOP</button></div></div>
  <div class="secondaryTimer"><span class="timerLabel">REST</span><span id="restClock" class="time">01:00</span><div class="controls"><button type="button" id="restReset" class="btn ghost">RESET</button></div></div>
</div>
</div>
<button type="button" id="mainBtn" class="primaryAction start">START</button>
<div id="todayView"></div><div id="progressView" class="hidden"></div><div id="programView" class="hidden"></div>
</div>
<nav class="tabs"><button type="button" data-tab="progress">Progress</button><button type="button" data-tab="today" class="on">Workout</button><button type="button" data-tab="program">Program</button></nav>
<div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const TKEY="abf_timers_v5";
let timers=load(TKEY,{elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null,startedAt:null,completed:false,slotKey:null,completedSnapshot:null}),wakeLock=null;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function persist(){try{localStorage.setItem(TKEY,JSON.stringify(timers));return true}catch{toast("Timer state could not be saved");return false}}
function now(){return Date.now()}
function toast(s){const e=document.getElementById("toast");if(!e)return;e.textContent=s;e.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove("show"),1800)}
function workSeconds(){return timers.elapsed+(timers.running&&timers.lastTick?Math.max(0,(now()-timers.lastTick)/1000):0)}
function capSeconds(){const live=workSeconds();return timers.limitEnd?Math.min(live,Math.max(0,(timers.limitEnd-(timers.startedAt||now()))/1000)):live}
function remain(end,fallback){return end?Math.max(0,(end-now())/1000):fallback}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function releaseAwake(){if(wakeLock){const w=wakeLock;wakeLock=null;w.release().catch(()=>{})}}
async function keepAwake(){
  try{
    if(!("wakeLock"in navigator)||!timers.running||document.visibilityState!=="visible")return;
    if(wakeLock&&!wakeLock.released)return;
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{wakeLock=null;if(timers.running&&document.visibilityState==="visible")setTimeout(keepAwake,50)});
  }catch{}
}
function endSession(reason){
  const seconds=Math.floor(capSeconds());
  const snap={seconds,startedAt:timers.startedAt,slotKey:timers.slotKey,reason};
  releaseAwake();
  timers={elapsed:seconds,lastTick:null,running:false,limitEnd:null,restEnd:null,startedAt:null,completed:true,slotKey:timers.slotKey,completedSnapshot:snap};
  persist();drawTimers();
  if(reason)toast(reason);
}
function start(){
  if(timers.running)return;
  const slot=window.ABFTracker?.getWorkoutSlot?.()||null;
  if(!slot){toast("Select a workout first");return}
  timers={elapsed:0,lastTick:now(),running:true,limitEnd:now()+900000,restEnd:null,startedAt:now(),completed:false,slotKey:slot,completedSnapshot:null};
  persist();document.dispatchEvent(new CustomEvent("abfWorkoutStarted",{detail:{startedAt:timers.startedAt,slotKey:slot}}));keepAwake();drawTimers();
}
function beginRest(){if(!timers.running||timers.restEnd)return;timers.restEnd=now()+60000;persist();drawTimers()}
function stop(){if(!timers.running)return;if(!confirm("Stop and end this workout?"))return;endSession("Workout ended")}
function main(){if(!timers.running){start();return}if(timers.restEnd){timers.restEnd=null;persist();drawTimers();toast("Rest ended");return}beginRest()}
function restartLimit(){
  if(timers.running){if(!confirm("Restart this 15-minute workout timer? Current timer progress will be discarded."))return;endSession("Workout restarted");start()}
  else{timers={elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null,startedAt:null,completed:false,slotKey:window.ABFTracker?.getWorkoutSlot?.()||null,completedSnapshot:null};persist();drawTimers();toast("Ready")}
}
function resetRest(){timers.restEnd=null;persist();drawTimers();toast("Rest timer reset")}
window.ABFTracker={
  getWorkoutSlot:()=>timers.slotKey,
  setWorkoutSlot:slot=>{if(timers.running&&timers.slotKey&&timers.slotKey!==slot)return false;return true},
  getWorkoutSeconds:()=>Math.floor(capSeconds()),
  peekWorkoutSession:expectedSlot=>{
    if(timers.running&&timers.slotKey===expectedSlot)return{seconds:Math.floor(capSeconds()),startedAt:timers.startedAt,slotKey:timers.slotKey};
    if(timers.completedSnapshot&&timers.completedSnapshot.slotKey===expectedSlot)return timers.completedSnapshot;
    return null;
  },
  isWorkoutRunning:()=>!!timers.running,
  getWorkoutStartTimestamp:()=>timers.startedAt||timers.completedSnapshot?.startedAt||0,
  consumeWorkoutSession:expectedSlot=>{
    let snap=null;
    if(timers.running){
      if(timers.slotKey!==expectedSlot)return null;
      snap={seconds:Math.floor(capSeconds()),startedAt:timers.startedAt,slotKey:timers.slotKey};
      timers={elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null,startedAt:null,completed:false,slotKey:null,completedSnapshot:null};
      releaseAwake();persist();drawTimers();return snap;
    }
    if(timers.completedSnapshot&&timers.completedSnapshot.slotKey===expectedSlot){
      snap=timers.completedSnapshot;
      timers={elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null,startedAt:null,completed:false,slotKey:null,completedSnapshot:null};
      persist();drawTimers();return snap;
    }
    return null;
  }
};
function drawTimers(){
  if(timers.running){timers.elapsed=Math.min(workSeconds(),900);timers.lastTick=now()}
  let l=timers.running?remain(timers.limitEnd,900):(timers.completed?0:900),r=remain(timers.restEnd,60);
  if(timers.running&&timers.limitEnd&&l<=0){endSession("15-minute limit reached");return}
  if(timers.restEnd&&r<=0){timers.restEnd=null;r=60;persist();toast("Rest complete")}
  document.getElementById("workClock").textContent=fmt(timers.running?capSeconds():(timers.completedSnapshot?.seconds||timers.elapsed||0));
  document.getElementById("limitClock").textContent=fmt(l);
  document.getElementById("restClock").textContent=fmt(r);
  const b=document.getElementById("mainBtn"),active=timers.running,resting=!!timers.restEnd;
  b.textContent=!active?"START":resting?"RESUME":"REST";b.className="primaryAction "+(!active?"start":resting?"resting":"rest");
  const stop=document.getElementById("stopBtn");stop.disabled=!active;stop.className="btn "+(active?"stop":"ghost");
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&timers.running)keepAwake()});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="mainBtn")main();else if(b.id==="stopBtn")stop();else if(b.id==="limitReset")restartLimit();else if(b.id==="restReset")resetRest()});
drawTimers();setInterval(drawTimers,250);
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
<script src="./day-picker.js"></script></body>
</html>
