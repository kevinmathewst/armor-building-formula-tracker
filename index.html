<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18233d">
<link rel="manifest" href="./manifest.webmanifest">
<title>ABF Tracker</title>
<style>
:root{--ink:#17233b;--muted:#687386;--paper:#f7f7f3;--card:#fff;--line:#e2e5eb;--navy:#1b2948;--green:#168466;--orange:#ef7a20;--red:#d84a4a;--shadow:0 8px 28px #17233b14}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;padding:12px 16px 105px}
.timerGrid{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin:0 0 8px;text-align:center}.timer{min-height:118px;border-radius:20px;padding:11px 8px;color:#fff;box-shadow:var(--shadow);position:relative}.work{background:var(--navy)}.limit{background:linear-gradient(135deg,#ef6118,#f2a41b)}.rest{background:linear-gradient(135deg,#187964,#39a878)}
.timerLabel{font-size:10px;font-weight:900;letter-spacing:.1em;opacity:.78}.time{font-variant-numeric:tabular-nums;font-size:clamp(28px,6vw,48px);font-weight:950;letter-spacing:-.05em;line-height:1;margin:8px 0 10px}.controls{display:flex;justify-content:center;gap:5px}.btn{border:0;border-radius:10px;padding:7px 10px;font-weight:850;color:var(--ink);background:#fff}.ghost{background:#ffffff1c;color:#fff;border:1px solid #ffffff35}.stop{background:#d94c55;color:#fff}.primaryAction{position:sticky;top:126px;z-index:29;width:100%;border:0;border-radius:16px;padding:14px;font-size:18px;font-weight:950;margin-bottom:10px;box-shadow:var(--shadow)}.primaryAction.start{background:#39b87c;color:#fff}.primaryAction.rest{background:#f0a51c;color:#2f2200}.primaryAction.resting{background:#168466;color:#fff}
.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 4px 18px #17233b09}.section h2,.section h3{margin:0 0 12px;letter-spacing:-.03em}.section h2{font-size:24px}.section h3{font-size:18px}.eyebrow,.week{font-size:10px;font-weight:900;letter-spacing:.16em;color:#6a7485}.todayHead{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 9px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:900;letter-spacing:.06em;background:#eef0f5;color:#596579}.goal{background:#fff0d7;color:#87530f}.note{background:#f2f3f7;border-radius:13px;padding:10px 12px;color:#596579;font-size:13px}.movement{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.movement:first-child{border-top:0;padding-top:0;margin-top:0}.movementTitle{display:flex;justify-content:space-between;gap:8px;align-items:center}.movementTitle h3{margin:0;font-size:20px}.seg,.bells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.seg button,.bells button{border:1px solid #d8dce4;background:#fff;border-radius:11px;padding:9px 4px;font-weight:850;color:var(--ink)}.seg button.on{background:#1d2d5b;color:#fff;border-color:#1d2d5b}.bells button.on{background:#285eb8;color:#fff;border-color:#285eb8}.bellRow,.logGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:9px;font-weight:900;letter-spacing:.08em;color:#6b7586;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #d8dce4;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}.stepper{height:42px;display:grid;grid-template-columns:42px 1fr 42px}.stepper button{border:1px solid #d8dce4;background:#f5f6f8;font-size:24px;color:var(--ink)}.stepper strong{display:grid;place-items:center;border-top:1px solid #d8dce4;border-bottom:1px solid #d8dce4;font-size:18px}.wide{grid-column:1/-1}.summary{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;color:var(--muted)}.saveBtn{width:100%;margin-top:10px;background:#1d2d5b;color:#fff}
.tabs{position:fixed;z-index:40;bottom:10px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));display:grid;grid-template-columns:1fr 1.35fr 1fr;background:#fff;border:1px solid #e0e3e9;border-radius:20px;padding:5px;box-shadow:0 15px 45px #17233b25;backdrop-filter:blur(16px)}.tabs button{border:0;background:transparent;padding:11px 4px;border-radius:15px;color:#737c8c;font-weight:850;font-size:12px}.tabs button:nth-child(2){font-size:15px;padding:13px 4px}.tabs button.on{background:#1d2d5b;color:#fff}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fbfbfc}.stat span{font-size:10px;color:var(--muted);font-weight:800}.stat b{display:block;font-size:24px;margin-top:3px}.historyItem{display:grid;grid-template-columns:65px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.historyItem:last-child{border:0}.dateBox{font-size:10px;font-weight:900;color:var(--muted)}.historyItem b{display:block}.historyItem small{color:var(--muted)}.danger{background:#fff0f0;color:#b33b3b}.empty{padding:28px 8px;text-align:center;color:var(--muted)}.programWeek{border:1px solid var(--line);border-radius:14px;margin:7px 0;overflow:hidden}.programWeek summary{padding:12px 14px;font-weight:900;cursor:pointer}.days{padding:2px 14px 10px}.day{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.toast{position:fixed;z-index:60;left:50%;bottom:85px;transform:translate(-50%,15px);background:#17233b;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:650px){.app{padding-left:11px;padding-right:11px}.timerGrid{gap:5px}.timer{min-height:105px;padding:9px 5px}.time{font-size:26px}.timer .btn{width:100%;font-size:10px;padding:6px}.controls{display:block}.primaryAction{top:113px}}
@media(max-width:300px){.app{padding:3px 4px 8px}.timerGrid{gap:2px;margin:0 -1px 4px}.timer{min-height:70px;border-radius:10px;padding:5px 2px}.timerLabel{font-size:6px}.time{font-size:20px;margin:4px 0}.timer .btn{font-size:7px;padding:3px;border-radius:7px}.primaryAction{top:74px;border-radius:9px;padding:7px;font-size:11px;margin-bottom:5px}.section{border-radius:11px;padding:8px;margin:4px 0}.section h2{font-size:15px}.section h3{font-size:14px}.movement{padding-top:7px;margin-top:7px}.movementTitle h3{font-size:13px}.pill{font-size:6px;padding:3px 5px}.note{font-size:8px;padding:6px}.seg,.bells{gap:3px;margin:5px 0}.seg button,.bells button{padding:5px 2px;font-size:8px;border-radius:7px}.bellRow,.logGrid{gap:4px}.field label{font-size:6px}.field input,.field select{padding:5px;font-size:8px}.stepper{height:28px;grid-template-columns:27px 1fr 27px}.stepper button{font-size:17px}.stepper strong{font-size:12px}.tabs{display:none}.saveBtn{font-size:9px;padding:6px}.historyItem{grid-template-columns:46px 1fr auto;font-size:9px}.historyItem small{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<div class="timerGrid">
<div class="timer limit"><div class="timerLabel">15-MIN</div><div id="limitClock" class="time">15:00</div><div class="controls"><button type="button" id="limitReset" class="btn ghost">RESET</button></div></div>
<div class="timer work"><div class="timerLabel">WORKOUT</div><div id="workClock" class="time">00:00</div><div class="controls"><button type="button" id="stopBtn" class="btn ghost" disabled>STOP</button></div></div>
<div class="timer rest"><div class="timerLabel">REST</div><div id="restClock" class="time">01:00</div><div class="controls"><button type="button" id="restReset" class="btn ghost">RESET</button></div></div>
</div>
<button type="button" id="mainBtn" class="primaryAction start">START</button>
<div id="todayView"></div><div id="progressView" class="hidden"></div><div id="programView" class="hidden"></div>
</div>
<nav class="tabs"><button type="button" data-tab="progress">Progress</button><button type="button" data-tab="today" class="on">Workout</button><button type="button" data-tab="program">Program</button></nav>
<div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const KEY="abf_data_v3",TKEY="abf_timers_v3",BACKUP_KEY="abf_backup_v3",SCHEMA=3;
const DEFAULT={startDate:new Date().toISOString().slice(0,10),logs:[]};
let data=load(KEY,DEFAULT),timers=load(TKEY,{elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null});
let wakeLock=null;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(BACKUP_KEY,JSON.stringify({schema:SCHEMA,savedAt:new Date().toISOString(),data}))}
function persistTimers(){localStorage.setItem(TKEY,JSON.stringify(timers))}
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove("show"),1800)}
async function keepAwake(){try{if("wakeLock"in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch{}}
function releaseAwake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&timers.running)keepAwake()});
function now(){return Date.now()}
function workSeconds(){return timers.elapsed+(timers.running&&timers.lastTick?Math.max(0,(now()-timers.lastTick)/1000):0)}
function remain(end,fallback){return end?Math.max(0,(end-now())/1000):fallback}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(){if(timers.running)return;timers.running=true;timers.lastTick=now();timers.limitEnd=timers.limitEnd||now()+900000;persistTimers();keepAwake();drawTimers()}
function beginRest(){if(!timers.running)return;timers.restEnd=now()+60000;persistTimers();drawTimers()}
function stop(){if(!timers.running)return;if(!confirm("Stop and end this workout?"))return;releaseAwake();timers={elapsed:0,lastTick:null,running:false,limitEnd:null,restEnd:null};persistTimers();drawTimers();toast("Workout ended")}
function main(){if(!timers.running)start();else if(!timers.restEnd)beginRest()}
function resetLimit(){timers.limitEnd=timers.running?now()+900000:null;persistTimers();drawTimers();toast("15-minute timer reset")}
function resetRest(){timers.restEnd=null;persistTimers();drawTimers();toast("Rest timer reset")}
function drawTimers(){
 if(timers.running){timers.elapsed=workSeconds();timers.lastTick=now()}
 let l=remain(timers.limitEnd,900),r=remain(timers.restEnd,60);
 if(timers.limitEnd&&l<=0){timers.limitEnd=null;l=0;persistTimers()}
 if(timers.restEnd&&r<=0){timers.restEnd=null;r=60;persistTimers()}
 document.getElementById("workClock").textContent=fmt(workSeconds());
 document.getElementById("limitClock").textContent=fmt(l);
 document.getElementById("restClock").textContent=fmt(r);
 const b=document.getElementById("mainBtn"),active=timers.running,resting=!!timers.restEnd;
 b.textContent=!active?"START":resting?"RESTING":"REST";
 b.className="primaryAction "+(!active?"start":resting?"resting":"rest");
 const stop=document.getElementById("stopBtn");stop.disabled=!active;stop.className="btn "+(active?"stop":"ghost");
}
const schedule={
1:[["Press","Press","Calibrate load and technique"],["ABC","ABC","Calibrate load and technique"],["Press","Press","Calibrate load and technique"]],
2:[["ABC","ABC","Calibrate load and technique"],["Press","Press","Calibrate load and technique"],["ABC","ABC","Calibrate load and technique"]],
3:[["Press","Press","Build from prior work"],["ABC","ABC","15–20 rounds"],["Press","Press","Hardest session of the week"]],
4:[["ABC","ABC","Medium/light; progress only if sustainable"],["Press","Press","Hardest session of the week"],["ABC","ABC","Medium/light"]],
5:[["Press","Press","Build from prior work"],["ABC","ABC","20–25 rounds"],["Press","Press","Hardest session; reduce afterward"]],
6:[["ABC","ABC","Medium/light; progress only if sustainable"],["Press","Press","Hardest session of the week"],["ABC","ABC","Medium/light"]],
7:[["Press","Press","3 × 2-3-5-10 or, if heavier, 5 × 2-3-5"],["ABC","ABC","GOAL: 30 rounds"],["Press","Press","2 × 2-3-5-10 or 3–4 × 2-3-5"]],
8:[["ABC","ABC","About 15 rounds"],["Press","Press","GOAL: 100 reps — 5 × 2-3-5-10 or 10 × 2-3-5"],["ABC","ABC","About 20 rounds"]]
};
function dayInfo(){const s=new Date(data.startDate+"T00:00:00"),d=new Date();d.setHours(0,0,0,0);const n=Math.max(0,Math.floor((d-s)/86400000));return{week:Math.min(8,Math.floor(n/7)+1),day:n%7+1}}
function plan(){const x=dayInfo();return{...x,p:schedule[x.week][Math.min(2,x.day-1)]}}
function total(type,r,e){return(type==="ABC"?r*6:r*20)+e}
function entryFor(type,w,d){const x=data.logs.find(v=>v.key===w+"-"+d);return x?.[type.toLowerCase()]||null}
function form(type,w,d,existing){
 const x=existing||{},variant=x.variant||"Double",left=x.left||20,right=x.right||20,rounds=x.rounds??0,extra=x.extra??0;
 return '<section class="movement" data-type="'+type+'"><div class="movementTitle"><h3>'+type+'</h3><span class="pill">'+(type==="ABC"?"2 cleans · 1 press · 3 squats":"2-3-5-10 ladder")+'</span></div>'+
 '<div class="note">'+(type==="ABC"?"6 reps per round. ":"20 reps per full ladder. ")+((w>=7&&type==="ABC")?"Goal week: 30 rounds.":(w>=7&&type==="Press"?"Goal week: 100 reps.":"Log the work you actually complete."))+'</div>'+
 '<div class="field" style="margin-top:9px"><label>EXECUTION</label></div><div class="seg"><button type="button" data-v="Double" class="'+(variant==="Double"?"on":"")+'">Double</button><button type="button" data-v="Single" class="'+(variant==="Single"?"on":"")+'">Single</button><button type="button" data-v="Offset" class="'+(variant==="Offset"?"on":"")+'">Offset</button></div>'+
 '<div class="field"><label>KETTLEBELLS</label></div><div class="bells"><button type="button" data-w="20" class="'+(left==20?"on":"")+'">20 lb</button><button type="button" data-w="30" class="'+(left==30?"on":"")+'">30 lb</button><button type="button" data-w="40" class="'+(left==40?"on":"")+'">40 lb</button></div>'+
 '<div class="bellRow"><div class="field"><label>LEFT BELL</label><select data-field="left"><option '+(left==20?"selected":"")+'>20</option><option '+(left==30?"selected":"")+'>30</option><option '+(left==40?"selected":"")+'>40</option></select></div><div class="field"><label>RIGHT BELL</label><select data-field="right"><option '+(right==20?"selected":"")+'>20</option><option '+(right==30?"selected":"")+'>30</option><option '+(right==40?"selected":"")+'>40</option></select></div></div>'+
 '<div class="logGrid" style="margin-top:8px"><div class="field"><label>ROUNDS</label><div class="stepper"><button type="button" data-step="rounds" data-delta="-1">−</button><strong data-field="rounds">'+rounds+'</strong><button type="button" data-step="rounds" data-delta="1">+</button></div></div><div class="field"><label>EXTRA REPS</label><div class="stepper"><button type="button" data-step="extra" data-delta="-1">−</button><strong data-field="extra">'+extra+'</strong><button type="button" data-step="extra" data-delta="1">+</button></div></div><div class="field"><label>RPE</label><select data-field="rpe"><option value="">—</option>'+Array.from({length:10},(_,i)=>'<option '+(Number(x.rpe)===i+1?"selected":"")+'>'+(i+1)+'</option>').join("")+'</select></div><div class="field"><label>TIME</label><input data-field="time" value="'+(x.time||"")+'" placeholder="e.g. 12:40"></div><div class="field wide"><label>NOTES</label><input data-field="notes" value="'+(x.notes||"")+'" placeholder="Optional"></div></div>'+
 '<div class="summary"><span>Total reps</span><strong data-total>'+total(type,rounds,extra)+'</strong></div><button type="button" class="btn saveBtn" data-save="'+type+'">'+(x.saved?"UPDATE":"LOG "+type)+'</button></section>'
}
function renderToday(){
 const q=plan(),both=false,old=entryFor(q.p[1],q.week,q.day);
 document.getElementById("todayView").innerHTML='<div class="todayHead"><span class="week">WEEK '+q.week+' · DAY '+q.day+'</span><span class="pill '+(q.week>=7?"goal":"")+'">'+(q.week>=7?"GOAL WEEK":"TODAY")+'</span></div>'+
 '<section class="section"><h2>'+q.p[0]+'</h2><div class="note">'+q.p[2]+'</div>'+form(q.p[1],q.week,q.day,old)+'</section>';
}
function renderProgress(){
 const logs=data.logs.flatMap(x=>["press","abc"].filter(k=>x[k]).map(k=>({...x[k],date:x.date,key:x.key,type:k.toUpperCase()}))).sort((a,b)=>b.date.localeCompare(a.date));
 const sessions=logs.length,bestABC=Math.max(0,...logs.filter(x=>x.type==="ABC").map(x=>x.rounds)),bestPress=Math.max(0,...logs.filter(x=>x.type==="PRESS").map(x=>x.total)),weights=Math.max(0,...logs.map(x=>Math.max(x.left||0,x.right||0)));
 document.getElementById("progressView").innerHTML='<section class="section"><h2>Progress</h2><div class="statGrid"><div class="stat"><span>SESSIONS</span><b>'+sessions+'</b></div><div class="stat"><span>BEST ABC</span><b>'+bestABC+' rounds</b></div><div class="stat"><span>BEST PRESS</span><b>'+bestPress+' reps</b></div><div class="stat"><span>HEAVIEST BELL</span><b>'+weights+' lb</b></div></div></section>'+
 '<section class="section"><h2>History</h2>'+(logs.length?logs.map((x,i)=>'<div class="historyItem"><div class="dateBox">'+x.date.slice(5)+'</div><div><b>'+x.type+'</b><small>'+x.rounds+' rounds · '+x.total+' reps · '+Math.max(x.left||0,x.right||0)+' lb'+(x.rpe?" · RPE "+x.rpe:"")+'</small></div><button type="button" class="btn danger" data-delete="'+x.key+'|'+x.type.toLowerCase()+'">×</button></div>').join(""):'<div class="empty">No workouts logged yet.</div>')+'</section>';
}
function renderProgram(){
 document.getElementById("programView").innerHTML='<section class="section"><h2>Program</h2><div class="note">Armor Building Formula reference. Weeks 1–2 are adapted to one movement per day, alternating Press and ABC. Weeks 3–6 follow the alternating build. Weeks 7–8 are goal weeks.</div>'+
 Object.entries(schedule).map(([w,days])=>'<details class="programWeek" '+(w==dayInfo().week?"open":"")+'><summary>Week '+w+(w>=7?" — GOAL WEEK":"")+'</summary><div class="days">'+days.map((p,i)=>'<div class="day"><b>Day '+(i+1)+' · '+p[0]+'</b><br><span class="muted">'+p[2]+'</span></div>').join("")+'</div></details>').join("")+
 '<div class="note" style="margin-top:10px"><b>Reference:</b> Dan John, <i>The Armor Building Formula</i>. This tracker preserves the program structure while adapting Weeks 1–2 to your one-movement-per-day schedule.</div></section>';
}
function renderAll(){renderToday();renderProgress();renderProgram()}
function saveMovement(type,section){
 const g=n=>section.querySelector('[data-field="'+n+'"]'),q=plan(),key=q.week+"-"+q.day;
 let row=data.logs.find(x=>x.key===key);if(!row){row={key,date:new Date().toISOString().slice(0,10)};data.logs.push(row)}
 row[type.toLowerCase()]={type,variant:section.querySelector(".seg .on")?.dataset.v||"Double",left:Number(g("left").value),right:Number(g("right").value),rounds:Number(section.querySelector('[data-field="rounds"]').textContent),extra:Number(section.querySelector('[data-field="extra"]').textContent),total:total(type,Number(section.querySelector('[data-field="rounds"]').textContent),Number(section.querySelector('[data-field="extra"]').textContent)),rpe:g("rpe").value?Number(g("rpe").value):null,time:g("time").value,notes:g("notes").value,saved:true};
 persist();renderAll();toast(type+" saved");
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.id==="mainBtn")return main();if(t.id==="stopBtn")return stop();if(t.id==="limitReset")return resetLimit();if(t.id==="restReset")return resetRest();
 if(t.dataset.tab){["today","progress","program"].forEach(k=>document.getElementById(k+"View").classList.toggle("hidden",k!==t.dataset.tab));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t.dataset.tab));return}
 if(t.dataset.step){const f=t.closest(".movement"),el=f.querySelector('[data-field="'+t.dataset.step+'"]'),max=t.dataset.step==="rounds"?35:100;el.textContent=Math.max(0,Math.min(max,Number(el.textContent)+Number(t.dataset.delta)));f.querySelector("[data-total]").textContent=total(f.dataset.type,Number(f.querySelector('[data-field="rounds"]').textContent),Number(f.querySelector('[data-field="extra"]').textContent));return}
 if(t.dataset.v){t.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));t.classList.add("on");return}
 if(t.dataset.w){const f=t.closest(".movement");f.querySelector('[data-field="left"]').value=t.dataset.w;f.querySelector('[data-field="right"]').value=t.dataset.w;f.querySelectorAll(".bells button").forEach(b=>b.classList.toggle("on",b.dataset.w===t.dataset.w));return}
 if(t.dataset.save)return saveMovement(t.dataset.save,t.closest(".movement"));
 if(t.dataset.delete){const [key,type]=t.dataset.delete.split("|");if(confirm("Delete this logged workout?")){const row=data.logs.find(x=>x.key===key);if(row)delete row[type];data.logs=data.logs.filter(x=>x.press||x.abc);persist();renderAll();toast("Workout deleted")}}
});
document.addEventListener("change",e=>{
 if(e.target.matches('[data-field="rounds"],[data-field="extra"]')){const f=e.target.closest(".movement");f.querySelector("[data-total]").textContent=total(f.dataset.type,Number(f.querySelector('[data-field="rounds"]').textContent),Number(f.querySelector('[data-field="extra"]').textContent))}
});
renderAll();drawTimers();setInterval(drawTimers,250);
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
