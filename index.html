<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>Armor Building Formula</title><style>body{margin:0;background:#f7f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}.load{max-width:420px;padding:28px;text-align:center}.load b{display:block;font-size:18px;margin-bottom:8px}.load span{color:#667085;font-size:14px}</style></head><body><div class="load"><b>Armor Building Formula</b><span>Loading workout tracker…</span></div><script>(async()=>{const src='https://raw.githubusercontent.com/kevinmathewst/armor-building-formula-tracker/21e5b5bd0c0a6639a8b48a25e1814dd0181e3204/index.html';try{let s=await fetch(src+'?v=6',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()});s=s.replaceAll('id="startTimer"','id="mainAction"').replaceAll('id="pauseTimer"','id="secondaryAction"');s=s.replace("if(t.id==='startTimer'){if(clockState.workoutStarted)return startRest();return startWorkout()}if(t.id==='pauseTimer')return pauseWorkout();","if(t.id==='mainAction'){if(clockState.restEnd)return pauseRest();if(clockState.workoutStarted)return startRest();return startWorkout()}if(t.id==='secondaryAction'){if(confirm('Stop and end this workout?'))return endWorkout(false)}");s=s.replace("render();tick();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});","function syncTimerControls(){const b=document.getElementById('mainAction'),q=document.getElementById('secondaryAction');if(!b||!q)return;const active=!!(state.draft&&state.draft.startedAt);[b,q].forEach(x=>{x.style.color='#fff';x.style.borderColor='transparent'});if(!active){b.textContent='START';b.style.background='#16a34a';q.textContent='STOP';q.style.background='#64748b';q.disabled=true}else if(clockState.restEnd){b.textContent='RESTING';b.style.background='#0d9
