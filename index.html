<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ABF Tracker">
<title>ABF Tracker</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#171717;--muted:#706e69;--line:#dedbd4;--good:#397052;--gold:#a77a16;--danger:#a33b32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}.top{padding:20px 3px 12px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:30px;line-height:1;margin:5px 0 0;letter-spacing:-.04em}h2{font-size:21px;margin:0 0 8px}.muted,.tiny{color:var(--muted);font-size:13px;line-height:1.4}.tiny{font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 1px #00000008}.hero{background:#171717;color:#fff;border-radius:22px;padding:20px;margin:8px 0 12px}.heroTitle{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:5px 0 12px}.hero .muted{color:#bbb}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#fff1c9;color:#624a08;font-size:11px;font-weight:800}.timerCard{position:sticky;top:0;z-index:10;background:#171717;color:#fff;border-radius:17px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:10px}.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;min-width:68px}.timerBtns{margin-left:auto;display:flex;gap:5px}.timerBtns button{min-height:34px;padding:5px 8px;background:#292929;border:1px solid #444;color:#fff;font-size:11px}.rest{font-size:11px;color:#aaa}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e5e2dc;border-radius:13px;padding:4px;margin:12px 0}.tabs button{border:0;background:transparent;color:#666;min-height:40px;border-radius:10px;font-size:12px;font-weight:750}.tabs button.active{background:#fff;color:#111;box-shadow:0 1px 4px #0002}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.metricLabel{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.metricValue{font-size:24px;font-weight:800;letter-spacing:-.04em}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid #cbc7bf;border-radius:11px;background:#fff;padding:9px 13px;font-weight:750;color:#171717}button.primary{background:#171717;color:#fff;border-color:#171717}.full{width:100%}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.choices button.selected{background:#171717;color:#fff;border-color:#171717}.weights{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.weightPair{display:grid;grid-template-columns:1fr 1fr;gap:6px}label{display:block;font-size:12px;font-weight:750;color:#444;margin:11px 0 5px}input,select,textarea{width:100%;min-height:45px;border:1px solid #cbc7bf;border-radius:11px;padding:10px;background:#fff}textarea{resize:vertical}.progress{height:8px;background:#e5e2dc;border-radius:9px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:#171717}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}.programRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex:none}.dot.done{background:var(--good)}.dot.current{background:var(--gold);box-shadow:0 0 0 4px #a77a1622}.note{background:#f8f5e9;border:1px solid #e8dfbd;padding:11px;border-radius:12px;font-size:12px;line-height:1.45}.component{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.component.done{border-color:#b9d0c1;background:#f8fbf9}.componentHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.componentTitle{font-weight:800;font-size:16px}.order{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.saveRow{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));padding-top:10px}.danger{color:var(--danger);background:transparent;border:0}.hidden{display:none!important}@media(max-width:390px){.timerBtns button{padding:5px 6px}.heroTitle{font-size:24px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="eyebrow">ARMOR BUILDING FORMULA</div><h1>ABF Tracker</h1></div><button id="iphone" style="border:0;background:transparent;color:#666;font-size:12px">iPhone</button></div>
<div class="timerCard"><div><div class="eyebrow" style="color:#aaa">WORKOUT</div><div id="timer" class="timer">00:00</div></div><div id="restText" class="rest"></div><div class="timerBtns"><button id="start">Start</button><button id="pause">Pause</button><button id="rest">Rest 60</button></div></div>
<div class="tabs"><button class="active" data-tab="today">Today</button><button data-tab="log">Log</button><button data-tab="progress">Progress</button><button data-tab="history">History</button></div>
<section id="today"><div id="todayCard"></div><div class="grid2"><div class="metric"><div class="metricLabel">Workouts</div><div id="sessions" class="metricValue">0/24</div></div><div class="metric"><div class="metricLabel">Streak</div><div id="streak" class="metricValue">0</div></div></div><div class="card"><div class="metricLabel">Best ABC</div><div id="abcBest" class="metricValue">0 rounds</div><div class="progress"><i id="abcBar" style="width:0"></i></div><div class="metricLabel" style="margin-top:14px">Best Press</div><div id="pressBest" class="metricValue">0 reps</div><div class="progress"><i id="pressBar" style="width:0"></i></div></div></section>
<section id="log" class="hidden"><div class="card"><div class="eyebrow">WORKOUT LOG</div><h2 id="logTitle">Log Workout</h2><div id="planNote" class="note"></div><label>Date<input id="date" type="date"></label><div id="components"></div><div class="saveRow"><button id="finish" class="primary full">Finish Workout</button></div></div></section>
<section id="progress" class="hidden"><div class="card"><div class="eyebrow">PROGRAM</div><h2>Weeks 1–8</h2><div id="weeks"></div></div><div class="grid2"><div class="metric"><div class="metricLabel">Heaviest bell</div><div id="heavy" class="metricValue">0 lb</div></div><div class="metric"><div class="metricLabel">Best ABC</div><div id="abcBest2" class="metricValue">0</div></div></div></section>
<section id="history" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>History</h2><button id="clear" class="danger">Clear</button></div><div id="historyList"></div></div><div class="card"><h2>Backup</h2><p class="muted">Export your local workout data.</p><button id="export" class="full">Export JSON</button></div></section>
</div>
<script>
(function(){'use strict';
var KEY='abf_tracker_v4',workouts=[];try{workouts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(workouts))workouts=[];}catch(e){workouts=[];}
var running=false,startTs=0,acc=0,restEnd=0,currentComponents=[];
var plan=[
{w:1,d:1,parts:[['Press','Press first'],['ABC','ABC second']],note:'Practice/load selection. Press: at least 20–30 total reps. ABC: at least 5 rounds.'},
{w:1,d:2,parts:[['ABC','ABC first'],['Press','Press second']],note:'Practice/load selection. ABC: at least 5 rounds. Press: at least 20–30 total reps.'},
{w:1,d:3,parts:[['Press','Press first'],['ABC','ABC second']],note:'Practice/load selection. Press: at least 20–30 total reps. ABC: at least 5 rounds.'},
{w:2,d:1,parts:[['ABC','ABC first'],['Press','Press second']],note:'Practice/load selection. ABC: at least 5 rounds. Press: at least 20–30 total reps.'},
{w:2,d:2,parts:[['Press','Press first'],['ABC','ABC second']],note:'Practice/load selection. Press: at least 20–30 total reps. ABC: at least 5 rounds.'},
{w:2,d:3,parts:[['ABC','ABC first'],['Press','Press second']],note:'Practice/load selection. ABC: at least 5 rounds. Press: at least 20–30 total reps.'},
{w:3,d:1,parts:[['Press','']],note:'Weeks 3–6: alternate movements. Day Two is the hardest session.'},
{w:3,d:2,parts:[['ABC','15–20 rounds']],note:'Hard ABC session: 15–20 rounds.'},
{w:3,d:3,parts:[['Press','']],note:'Follow the book’s Press progression.'},
{w:4,d:1,parts:[['ABC','Medium/light']],note:'Two-ABC week: medium/light; total slightly above the prior single hard week.'},
{w:4,d:2,parts:[['Press','Hardest session']],note:'Day Two is the hardest session.'},
{w:4,d:3,parts:[['ABC','Medium/light']],note:'Two-ABC week: medium/light; total slightly above the prior single hard week.'},
{w:5,d:1,parts:[['Press','']],note:'Single Press week: slowly add reps.'},
{w:5,d:2,parts:[['ABC','20–25 rounds']],note:'Hard ABC session: 20–25 rounds.'},
{w:5,d:3,parts:[['Press','']],note:'Single Press week: slowly add reps.'},
{w:6,d:1,parts:[['ABC','Medium/light']],note:'Two-ABC week: medium/light; total slightly above the prior single hard week.'},
{w:6,d:2,parts:[['Press','Hardest session']],note:'Day Two is the hardest session.'},
{w:6,d:3,parts:[['ABC','Medium/light']],note:'Two-ABC week: medium/light; total slightly above the prior single hard week.'},
{w:7,d:1,parts:[['Press','3×2-3-5-10, or heavier 2-3-5']],note:'Goal week. Use the book’s listed Press option.'},
{w:7,d:2,parts:[['ABC','GOAL: 30 rounds']],note:'Goal: 30 ABC rounds.'},
{w:7,d:3,parts:[['Press','2×2-3-5-10, or 3–4×2-3-5']],note:'Goal week. Use the book’s listed Press option.'},
{w:8,d:1,parts:[['ABC','~15 rounds']],note:'About 15 ABC rounds.'},
{w:8,d:2,parts:[['Press','GOAL: 100 reps']],note:'Goal: 100 Press reps.'},
{w:8,d:3,parts:[['ABC','~20 rounds']],note:'About 20 ABC rounds.'}
];
function el(id){return document.getElementById(id)}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function persist(){localStorage.setItem(KEY,JSON.stringify(workouts));render()}
function current(){return plan[Math.min(workouts.length,23)]}
function setTab(name){document.querySelectorAll('section').forEach(function(s){s.classList.add('hidden')});document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('active')});el(name).classList.remove('hidden');var b=document.querySelector('[data-tab="'+name+'"]');if(b)b.classList.add('active');if(name==='log')buildLog()}
function tick(){var t=acc+(running?(Date.now()-startTs)/1000:0);el('timer').textContent=fmt(t);if(restEnd){var r=(restEnd-Date.now())/1000;el('restText').textContent=r>0?'Rest '+fmt(r):'Rest done';if(r<=0)restEnd=0;}setTimeout(tick,250)}
function componentHTML(type,i){var hint=type==='ABC'?'ABC: 6 reps/round — 2 cleans + 1 press + 3 front squats.':'Press: 20 reps/ladder round — 2-3-5-10.';var target=current().parts[i][1];return '<div class="component" id="comp'+i+'"><div class="componentHead"><div><div class="order">Component '+(i+1)+' of '+current().parts.length+'</div><div class="componentTitle">'+type+'</div></div><span class="badge">PLANNED</span></div><div class="tiny" style="margin:6px 0">'+(target||'Book progression')+'</div><label>Actual equipment</label><div class="choices equip"><button data-e="Double">Double</button><button data-e="Single">Single</button><button data-e="Offset">Offset</button></div><label>Bell weight</label><div class="weights"><button data-p="20">20</button><button data-p="30">30</button><button data-p="40">40</button></div><div class="weightPair"><input class="left" type="number" placeholder="Left lb"><input class="right" type="number" placeholder="Right lb"></div><div class="grid2"><div><label>Rounds</label><input class="rounds" type="number" min="0" max="35" value="0"></div><div><label>Extra reps</label><input class="extra" type="number" min="0" value="0"></div></div><div class="tiny">'+hint+'</div><div class="grid2"><div><label>RPE</label><select class="rpe"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><div><label>Time (sec)</label><input class="time" type="number" min="0"></div></div><label>Notes</label><textarea class="notes" rows="2" placeholder="Optional"></textarea><button class="componentDone full" data-index="'+i+'">Save '+type+'</button></div>'}
function buildLog(){var p=current();el('logTitle').textContent='Week '+p.w+' · Day '+p.d;el('planNote').innerHTML='<b>Planned workout: '+p.parts.map(function(x){return x[0]}).join(' + ')+'</b><br>'+p.note+'<br><span class="tiny">The plan is fixed. Actual equipment can be Double, Single, or Offset; that records what you actually used without changing the prescription.</span>';el('date').value=new Date().toISOString().slice(0,10);currentComponents=[];el('components').innerHTML=p.parts.map(function(x,i){return componentHTML(x[0],i)}).join('');wireComponents()}
function readComponent(i){var box=el('comp'+i),type=current().parts[i][0],rounds=Number(box.querySelector('.rounds').value)||0,extra=Number(box.querySelector('.extra').value)||0;return{movement:type,equipment:box.querySelector('.equip .selected')?box.querySelector('.equip .selected').getAttribute('data-e'):'Double',left:Number(box.querySelector('.left').value)||0,right:Number(box.querySelector('.right').value)||0,rounds:rounds,extra:extra,reps:type==='ABC'?rounds*6+extra:rounds*20+extra,rpe:Number(box.querySelector('.rpe').value)||0,time:Number(box.querySelector('.time').value)||0,notes:box.querySelector('.notes').value}}
function wireComponents(){document.querySelectorAll('.equip button').forEach(function(b){b.onclick=function(){var box=b.closest('.component');box.querySelectorAll('.equip button').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')}});document.querySelectorAll('.weights button').forEach(function(b){b.onclick=function(){var box=b.closest('.component'),w=Number(b.getAttribute('data-p'));box.querySelector('.left').value=w;box.querySelector('.right').value=box.querySelector('.equip .selected')&&box.querySelector('.equip .selected').getAttribute('data-e')==='Single'?'':w}});document.querySelectorAll('.componentDone').forEach(function(b){b.onclick=function(){var i=Number(b.getAttribute('data-index')),c=readComponent(i);currentComponents[i]=c;el('comp'+i).classList.add('done');b.textContent=current().parts[i][0]+' saved';}})}
function finish(){var p=current();for(var i=0;i<p.parts.length;i++){if(!currentComponents[i]){alert('Save '+p.parts[i][0]+' before finishing this workout.');return;} }var elapsed=acc+(running?(Date.now()-startTs)/1000:0);running=false;workouts.push({index:workouts.length+1,week:p.w,day:p.d,date:el('date').value,components:currentComponents.slice(),time:Math.round(elapsed),completedAt:new Date().toISOString()});acc=0;currentComponents=[];persist();setTab('today')}
function streak(){if(!workouts.length)return 0;var dates={};workouts.forEach(function(w){dates[w.date]=1});var list=Object.keys(dates).sort().reverse(),n=1;for(var i=1;i<list.length;i++){var a=new Date(list[i-1]+'T12:00:00'),b=new Date(list[i]+'T12:00:00');if(Math.round((a-b)/86400000)<=3)n++;else break;}return n}
function render(){var p=current(),idx=Math.min(workouts.length,23),done=workouts.length>=24;el('todayCard').innerHTML='<div class="hero"><div class="eyebrow" style="color:#aaa">'+(done?'PROGRAM COMPLETE':('WEEK '+p.w+' · DAY '+p.d))+'</div><div class="heroTitle">'+(done?'8-Week Formula Complete':p.parts.map(function(x){return x[0]}).join(' + '))+'</div><span class="badge">'+(done?'24 / 24 WORKOUTS':p.note.split('.')[0])+'</span><div style="height:14px"></div>'+(done?'':'<button id="heroLog" class="full">Log Today</button>')+'</div>';if(!done)el('heroLog').onclick=function(){setTab('log')};el('sessions').textContent=workouts.length+'/24';el('streak').textContent=streak();var ab=0,pr=0,heavy=0;workouts.forEach(function(w){w.components.forEach(function(c){if(c.movement==='ABC')ab=Math.max(ab,c.rounds||0);if(c.movement==='Press')pr=Math.max(pr,c.reps||0);heavy=Math.max(heavy,c.left||0,c.right||0)})});el('abcBest').textContent=ab+' rounds';el('pressBest').textContent=pr+' reps';el('abcBar').style.width=Math.min(100,ab/30*100)+'%';el('pressBar').style.width=Math.min(100,pr/100*100)+'%';el('abcBest2').textContent=ab+' rounds';el('heavy').textContent=heavy+' lb';el('weeks').innerHTML=plan.map(function(x,i){var w=workouts[i];return '<div class="programRow"><span class="dot '+(w?'done':i===idx?'current':'')+'"></span><div style="flex:1"><b>Week '+x.w+' · Day '+x.d+'</b><div class="tiny">'+x.parts.map(function(q){return q[0]}).join(' + ')+' · '+x.note+'</div></div>'+(w?'<span class="tiny">Done</span>':'')+'</div>'}).join('');el('historyList').innerHTML=workouts.length?workouts.slice().reverse().map(function(w){return '<div class="row"><div><b>'+w.date+' · W'+w.week+'D'+w.day+'</b><div class="tiny">'+w.components.map(function(c){return c.movement+' '+c.equipment+' '+c.left+'/'+c.right+' lb · '+(c.movement==='ABC'?c.rounds+' rounds':c.reps+' reps')}).join('<br>')+'</div></div><div style="text-align:right"><b>'+fmt(w.time)+'</b></div></div>'}).join(''):'<div class="muted">No workouts logged yet.</div>'}
document.addEventListener('click',function(e){var t=e.target;if(t.matches('.tabs button'))setTab(t.getAttribute('data-tab'));if(t.id==='start'&&!running){startTs=Date.now();running=true}if(t.id==='pause'&&running){acc+=(Date.now()-startTs)/1000;running=false}if(t.id==='rest')restEnd=Date.now()+60000;if(t.id==='iphone')alert('On iPhone: open this site in Safari → Share → Add to Home Screen.');if(t.id==='finish')finish();if(t.id==='clear'&&confirm('Clear all workout data? This cannot be undone.')){workouts=[];persist()}if(t.id==='export'){var blob=new Blob([JSON.stringify(workouts,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='abf-tracker-backup.json';a.click()}});tick();render();
})();
</script></body></html>
