<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ABF Tracker"><title>ABF Tracker</title><style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#171717;--muted:#706e69;--line:#dedbd4;--soft:#ece9e2;--good:#397052;--gold:#a77a16;--danger:#a33b32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}.top{padding:20px 3px 12px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:30px;line-height:1;margin:5px 0 0;letter-spacing:-.04em}h2{font-size:21px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.4}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 1px #00000008}.hero{background:#171717;color:#fff;border-radius:22px;padding:20px;margin:8px 0 12px}.heroTitle{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:5px 0 14px}.hero .muted{color:#bbb}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#fff1c9;color:#624a08;font-size:11px;font-weight:800}.timerCard{position:sticky;top:0;z-index:5;background:#171717;color:#fff;border-radius:17px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:10px}.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;min-width:68px}.timerBtns{margin-left:auto;display:flex;gap:5px}.timerBtns button{min-height:34px;padding:5px 8px;background:#292929;border:1px solid #444;color:#fff;font-size:11px}.rest{font-size:11px;color:#aaa}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e5e2dc;border-radius:13px;padding:4px;margin:12px 0}.tabs button{border:0;background:transparent;color:#666;min-height:40px;border-radius:10px;font-size:12px;font-weight:750}.tabs button.active{background:#fff;color:#111;box-shadow:0 1px 4px #0002}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.metricLabel{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.metricValue{font-size:24px;font-weight:800;letter-spacing:-.04em}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid #cbc7bf;border-radius:11px;background:#fff;padding:9px 13px;font-weight:750;color:#171717}button.primary{background:#171717;color:#fff;border-color:#171717}.full{width:100%}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.choices button.selected{background:#171717;color:#fff;border-color:#171717}.weights{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.weightPair{display:grid;grid-template-columns:1fr 1fr;gap:6px}label{display:block;font-size:12px;font-weight:750;color:#444;margin:11px 0 5px}input,select,textarea{width:100%;min-height:45px;border:1px solid #cbc7bf;border-radius:11px;padding:10px;background:#fff}textarea{resize:vertical}.progress{height:8px;background:#e5e2dc;border-radius:9px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:#171717}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}.programRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex:none}.dot.done{background:var(--good)}.dot.current{background:var(--gold);box-shadow:0 0 0 4px #a77a1622}.tiny{font-size:11px;color:var(--muted)}.hidden{display:none!important}.note{background:#f8f5e9;border:1px solid #e8dfbd;padding:11px;border-radius:12px;font-size:12px;line-height:1.4}.saveRow{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));padding-top:10px}.danger{color:var(--danger);background:transparent;border:0}@media(max-width:390px){.timerBtns button{padding:5px 6px}.heroTitle{font-size:24px}}
</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">ARMOR BUILDING FORMULA</div><h1>ABF Tracker</h1></div><button id="iphone" style="border:0;background:transparent;color:#666;font-size:12px">iPhone</button></div>
<div class="timerCard"><div><div class="eyebrow" style="color:#aaa">WORKOUT</div><div id="timer" class="timer">00:00</div></div><div id="restText" class="rest"></div><div class="timerBtns"><button id="start">Start</button><button id="pause">Pause</button><button id="rest">Rest 60</button></div></div>
<div class="tabs"><button class="active" data-tab="today">Today</button><button data-tab="log">Log</button><button data-tab="progress">Progress</button><button data-tab="history">History</button></div>
<section id="today"><div id="todayCard"></div><div class="grid2"><div class="metric"><div class="metricLabel">Sessions</div><div id="sessions" class="metricValue">0/24</div></div><div class="metric"><div class="metricLabel">Streak</div><div id="streak" class="metricValue">0</div></div></div><div class="card"><div class="metricLabel">Best ABC</div><div id="abcBest" class="metricValue">0 rounds</div><div class="progress"><i id="abcBar" style="width:0"></i></div><div class="metricLabel" style="margin-top:14px">Best Press</div><div id="pressBest" class="metricValue">0 reps</div><div class="progress"><i id="pressBar" style="width:0"></i></div></div></section>
<section id="log" class="hidden"><div class="card"><div class="eyebrow">SESSION LOG</div><h2 id="logTitle">Log Workout</h2><div id="planNote" class="note"></div><label>Date<input id="date" type="date"></label><label>Movement</label><div id="movementChoices" class="choices"></div><label>Actual equipment</label><div id="equipChoices" class="choices"><button data-e="Double">Double</button><button data-e="Single">Single</button><button data-e="Offset">Offset</button></div><label>Bell weight</label><div class="weights"><button data-p="20">20</button><button data-p="30">30</button><button data-p="40">40</button></div><div class="weightPair"><input id="left" type="number" placeholder="Left lb"><input id="right" type="number" placeholder="Right lb"></div><div class="grid2"><div><label>Rounds</label><input id="rounds" type="number" min="0" max="35" value="0"></div><div><label>Extra reps</label><input id="extra" type="number" min="0" value="0"></div></div><div class="tiny" id="repHint"></div><div class="grid2"><div><label>RPE</label><select id="rpe"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><div><label>Time (sec)</label><input id="time" type="number" min="0"></div></div><label>Notes</label><textarea id="notes" rows="3" placeholder="Optional"></textarea><div class="saveRow"><button id="save" class="primary full">Save Session</button></div></div></section>
<section id="progress" class="hidden"><div class="card"><div class="eyebrow">PROGRAM</div><h2>Weeks 1–8</h2><div id="weeks"></div></div><div class="grid2"><div class="metric"><div class="metricLabel">Heaviest bell</div><div id="heavy" class="metricValue">0 lb</div></div><div class="metric"><div class="metricLabel">Best ABC</div><div id="abcBest2" class="metricValue">0</div></div></div></section>
<section id="history" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>History</h2><button id="clear" class="danger">Clear</button></div><div id="historyList"></div></div><div class="card"><h2>Backup</h2><p class="muted">Export your local workout data.</p><button id="export" class="full">Export JSON</button></div></section></div>
<script>
(function(){'use strict';
var KEY='abf_tracker_v3',data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[];}catch(e){data=[];}
var running=false,startTs=0,acc=0,restEnd=0,selectedMovement='ABC',equipment='Double';
var plan=[
['Week 1','Day 1','Press + ABC','Press first, then ABC'],['Week 1','Day 2','ABC + Press','ABC first, then Press'],['Week 1','Day 3','Press + ABC','Press first, then ABC'],
['Week 2','Day 1','ABC + Press','ABC first, then Press'],['Week 2','Day 2','Press + ABC','Press first, then ABC'],['Week 2','Day 3','ABC + Press','ABC first, then Press'],
['Week 3','Day 1','Press','Practice / load selection'],['Week 3','Day 2','ABC','15–20 rounds'],['Week 3','Day 3','Press','Follow book progression'],
['Week 4','Day 1','ABC','Medium/light'],['Week 4','Day 2','Press','Hardest session'],['Week 4','Day 3','ABC','Medium/light'],
['Week 5','Day 1','Press','Build reps'],['Week 5','Day 2','ABC','20–25 rounds'],['Week 5','Day 3','Press','Follow book progression'],
['Week 6','Day 1','ABC','Medium/light'],['Week 6','Day 2','Press','Hardest session'],['Week 6','Day 3','ABC','Build rounds'],
['Week 7','Day 1','Press','3×2-3-5-10 or heavier 2-3-5'],['Week 7','Day 2','ABC','GOAL: 30 rounds'],['Week 7','Day 3','Press','2×2-3-5-10 or 3–4×2-3-5'],
['Week 8','Day 1','ABC','~15 rounds'],['Week 8','Day 2','Press','GOAL: 100 reps'],['Week 8','Day 3','ABC','~20 rounds']];
function el(id){return document.getElementById(id)}function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}render();}
function currentPlan(){return plan[Math.min(data.length,plan.length-1)];}
function setTab(name){var sections=document.querySelectorAll('section'),tabs=document.querySelectorAll('.tabs button');for(var i=0;i<sections.length;i++)sections[i].classList.add('hidden');for(var j=0;j<tabs.length;j++)tabs[j].classList.remove('active');el(name).classList.remove('hidden');var b=document.querySelector('[data-tab="'+name+'"]');if(b)b.classList.add('active');if(name==='log')buildLog();}
function tick(){var t=acc+(running?(Date.now()-startTs)/1000:0);el('timer').textContent=fmt(t);if(restEnd){var r=(restEnd-Date.now())/1000;if(r>0)el('restText').textContent='Rest '+fmt(r);else{restEnd=0;el('restText').textContent='Rest done';}}window.setTimeout(tick,250)}
function buildLog(){var p=currentPlan();el('logTitle').textContent=p[2];el('planNote').innerHTML='<b>'+p[0]+' · '+p[1]+'</b><br>Planned: <b>'+p[2]+'</b><br>'+p[3]+'<br><span class="tiny">Original prescription stays intact. Actual equipment may be Double, Single, or Offset.</span>';el('date').value=new Date().toISOString().slice(0,10);var mc=el('movementChoices');mc.innerHTML='<button data-m="Press">Press</button><button data-m="ABC">ABC</button>';var mb=document.querySelector('[data-m="'+selectedMovement+'"]');if(mb)mb.classList.add('selected');el('repHint').textContent=selectedMovement==='ABC'?'ABC: 6 reps per round (2 cleans + 1 press + 3 front squats).':'Press: 20 reps per ladder round (2-3-5-10).';var eb=document.querySelector('[data-e="'+equipment+'"]');if(eb)eb.classList.add('selected');}
function streak(){if(!data.length)return 0;var dates={};for(var i=0;i<data.length;i++)dates[data[i].date]=1;var list=Object.keys(dates).sort().reverse(),n=1;for(var k=1;k<list.length;k++){var a=new Date(list[k-1]+'T12:00:00'),b=new Date(list[k]+'T12:00:00'),gap=Math.round((a-b)/86400000);if(gap<=3)n++;else break;}return n;}
function render(){var p=currentPlan(),idx=Math.min(data.length,23);el('todayCard').innerHTML='<div class="hero"><div class="eyebrow" style="color:#aaa">'+p[0].toUpperCase()+' · '+p[1].toUpperCase()+'</div><div class="heroTitle">'+p[2]+'</div><span class="badge">'+p[3]+'</span><div style="height:14px"></div><button id="heroLog" class="full">Log Today</button></div>';el('heroLog').onclick=function(){setTab('log')};el('sessions').textContent=data.length+'/24';el('streak').textContent=streak();var ab=0,pr=0,heavy=0;for(var i=0;i<data.length;i++){if(data[i].movement==='ABC')ab=Math.max(ab,Number(data[i].rounds)||0);if(data[i].movement==='Press')pr=Math.max(pr,Number(data[i].reps)||0);heavy=Math.max(heavy,Number(data[i].left)||0,Number(data[i].right)||0);}el('abcBest').textContent=ab+' rounds';el('pressBest').textContent=pr+' reps';el('abcBar').style.width=Math.min(100,ab/30*100)+'%';el('pressBar').style.width=Math.min(100,pr/100*100)+'%';el('abcBest2').textContent=ab+' rounds';el('heavy').textContent=heavy+' lb';var w='';for(var x=0;x<plan.length;x++){w+='<div class="programRow"><span class="dot '+(x<data.length?'done':x===idx?'current':'')+'"></span><div style="flex:1"><b>'+plan[x][0]+' · '+plan[x][1]+'</b><div class="tiny">'+plan[x][2]+' · '+plan[x][3]+'</div></div>'+(x<data.length?'<span class="tiny">Done</span>':'')+'</div>';}el('weeks').innerHTML=w;el('historyList').innerHTML=data.length?data.slice().reverse().map(function(x){return '<div class="row"><div><b>'+x.date+'</b><div class="tiny">'+x.week+' · '+x.movement+' · '+x.equipment+' '+x.left+'/'+x.right+' lb</div></div><div style="text-align:right"><b>'+(x.movement==='ABC'?x.rounds+' rounds':x.reps+' reps')+'</b><div class="tiny">RPE '+(x.rpe||'—')+'</div></div></div>';}).join(''):'<div class="muted">No sessions logged yet.</div>';}

document.addEventListener('click',function(e){var t=e.target;if(t.matches('.tabs button'))setTab(t.getAttribute('data-tab'));if(t.id==='start'&&!running){startTs=Date.now();running=true;}if(t.id==='pause'&&running){acc+=(Date.now()-startTs)/1000;running=false;}if(t.id==='rest')restEnd=Date.now()+60000;if(t.id==='iphone')alert('On iPhone: open this site in Safari → Share → Add to Home Screen.');if(t.hasAttribute('data-m')){selectedMovement=t.getAttribute('data-m');document.querySelectorAll('[data-m]').forEach(function(b){b.classList.remove('selected')});t.classList.add('selected');el('repHint').textContent=selectedMovement==='ABC'?'ABC: 6 reps per round (2 cleans + 1 press + 3 front squats).':'Press: 20 reps per ladder round (2-3-5-10).';}if(t.hasAttribute('data-e')){equipment=t.getAttribute('data-e');document.querySelectorAll('[data-e]').forEach(function(b){b.classList.remove('selected')});t.classList.add('selected');}if(t.hasAttribute('data-p')){var w=Number(t.getAttribute('data-p'));el('left').value=w;el('right').value=equipment==='Single'?'':w;}if(t.id==='save'){var rounds=Number(el('rounds').value)||0,extra=Number(el('extra').value)||0,reps=selectedMovement==='ABC'?rounds*6+extra:rounds*20+extra;var elapsed=acc+(running?(Date.now()-startTs)/1000:0);running=false;data.push({date:el('date').value,movement:selectedMovement,equipment:equipment,left:Number(el('left').value)||0,right:Number(el('right').value)||0,rounds:rounds,extra:extra,reps:reps,rpe:Number(el('rpe').value)||0,notes:el('notes').value,time:Number(el('time').value)||Math.round(elapsed),week:currentPlan()[0],day:currentPlan()[1]});acc=0;saveData();setTab('today');}if(t.id==='clear'&&confirm('Clear all workout data? This cannot be undone.')){data=[];saveData();}if(t.id==='export'){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='abf-tracker-backup.json';a.click();}}
);tick();render();
})();
</script></body></html>
